# 使用 GitHub Actions 构建好的镜像（GitHub Container Registry，支持 amd64 / arm64），不需要在本机构建：
#
#   docker compose -f docker-compose.ghcr.yml up -d
#
# 更新到最新版本：
#
#   docker compose -f docker-compose.ghcr.yml pull && docker compose -f docker-compose.ghcr.yml up -d
#
# 镜像名默认是本仓库的 ghcr.io/dzxx36gyy/legado-web-remix，自己 fork 后用环境变量 LEGADO_IMAGE 指定，
# 例如在同目录的 .env 文件里写：LEGADO_IMAGE=ghcr.io/<用户名>/<仓库名>:latest
# 可用的标签：latest（默认分支最新）、构建时间（如 20261024-1530）、1.2.3（来自 v1.2.3 标签）。
# 镜像默认是私有的：需要先 docker login ghcr.io，或在 GitHub 的 Package settings 里改为 Public。
services:
  legado-web:
    image: ${LEGADO_IMAGE:-ghcr.io/dzxx36gyy/legado-web-remix:latest}
    ports:
      - "8955:8080"
    volumes:
      - ./data:/data
    environment:
      LEGADO_SEARCH_CACHE_TTL_MINUTES: ${LEGADO_SEARCH_CACHE_TTL_MINUTES:-60}
      # 默认使用 SQLite（数据在 ./data/legado.db）。改用 PostgreSQL 时取消下面的注释
      # LEGADO_DB_TYPE: postgres
      # LEGADO_DB_URL: jdbc:postgresql://postgres:5432/legado
      # LEGADO_DB_USER: legado
      # LEGADO_DB_PASSWORD: legado
      TZ: Asia/Shanghai
      # 服务以普通用户运行（不是 root），启动时会把 ./data 里的文件改成这个用户。
      # 设成宿主机上自己账号的 uid / gid（执行 id 查看），./data 里的文件就属于你自己，默认 1000
      PUID: 1000
      PGID: 1000
    restart: unless-stopped
    # depends_on: [postgres]
    networks:
      - legado-network

  # 首选浏览器（默认启动）：webView:true 的书源、远程浏览器（系统设置中开启）需要。
  # 在后台“系统设置”的“浏览器调试地址”中填写 http://cloak:9222。
  # 每次打开网页都在新的浏览器上下文（相当于无痕窗口）中进行，用完销毁，不会在浏览器里留下数据。
  # 调试端口没有密码，不要映射到公网。
  # 许可证放在 .env 的 CLOAKBROWSER_LICENSE_KEY，并挂载 ./cloak-data 持久化
  # 密钥文件和下载的浏览器，重建容器后不用重新领取和下载
  cloak:
    image: cloakhq/cloakbrowser
    container_name: cloak
    command: cloakserve
    restart: unless-stopped
    environment:
      CLOAKBROWSER_LICENSE_KEY: ${CLOAKBROWSER_LICENSE_KEY}
    volumes:
      - ./cloak-data:/root/.cloakbrowser
    networks:
      - legado-network

  # 备选 Chrome headless：使用时注释上面的 cloak 服务，取消下面的注释。
  # 后台“浏览器调试地址”改为 http://browser:9222，不会自动回退或切换。
  # browser:
  #   image: chromedp/headless-shell:latest
  #   restart: unless-stopped
  #   shm_size: 2gb
  #   networks:
  #     - legado-network

  # postgres:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_DB: legado
  #     POSTGRES_USER: legado
  #     POSTGRES_PASSWORD: legado
  #   volumes:
  #     - ./pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped

networks:
  legado-network:
    driver: bridge

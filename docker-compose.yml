# 从源码重建并更新 Java 安全补丁（只更新 Legado，保留 ./data）：
#   docker compose build --pull --no-cache legado-web && docker compose up -d --no-deps legado-web
#   docker compose exec -T legado-web java -version
# 普通重启或只替换 JAR 不会更新 Java。
services:
  legado-web:
    build: .
    ports:
      - "8955:8080"
    volumes:
      - ./data:/data
    environment:
      LEGADO_SEARCH_CACHE_TTL_MINUTES: ${LEGADO_SEARCH_CACHE_TTL_MINUTES:-60}
      # 默认使用 SQLite（数据在 ./data/legado.db）。改用 PostgreSQL 时取消下面的注释
      # LEGADO_DB_TYPE: postgres
      # LEGADO_DB_URL: jdbc:postgresql://postgres:5432/legado
      # LEGADO_DB_USER: legado
      # LEGADO_DB_PASSWORD: legado
      TZ: Asia/Shanghai
      # 服务以普通用户运行（不是 root），启动时会把 ./data 里的文件改成这个用户。
      # 设成宿主机上自己账号的 uid / gid（执行 id 查看），./data 里的文件就属于你自己，默认 1000
      PUID: 1000
      PGID: 1000
    restart: unless-stopped
    # depends_on: [postgres]
    networks:
      - legado-network

  # 指定站点使用的 Cloak：后台填写 Cloak 浏览器地址 http://cloak:9222 和站点域名。
  # 不使用 Cloak 时可以移除此服务；默认浏览器使用下面的 Chromium。
  # 每次打开网页都在新的浏览器上下文（相当于无痕窗口）中进行，用完销毁，不会在浏览器里留下数据。
  # 调试端口没有密码，不要映射到公网。
  # 许可证放在 .env 的 CLOAKBROWSER_LICENSE_KEY，并挂载 ./cloak-data 持久化
  # 密钥文件和下载的浏览器，重建容器后不用重新领取和下载
  cloak:
    image: cloakhq/cloakbrowser
    container_name: cloak
    command: cloakserve
    restart: unless-stopped
    environment:
      CLOAKBROWSER_LICENSE_KEY: ${CLOAKBROWSER_LICENSE_KEY}
    volumes:
      - ./cloak-data:/root/.cloakbrowser
    networks:
      - legado-network

  # 默认 Chromium：后台“默认浏览器调试地址”填写 http://browser:9222。
  browser:
    image: chromedp/headless-shell:latest
    restart: unless-stopped
    shm_size: 2gb
    networks:
      - legado-network

  # postgres:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_DB: legado
  #     POSTGRES_USER: legado
  #     POSTGRES_PASSWORD: legado
  #   volumes:
  #     - ./pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #    - legado-network

networks:
  legado-network:
    driver: bridge
